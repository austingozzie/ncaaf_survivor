<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bool Bloods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#1B4332; --field-dark:#12281E; --chalk:#F7F5EF; --gold:#D4A73F; --navy:#12181F; --red:#B3261E;
    --line:rgba(23,27,21,0.14); --bg:#F7F5EF; --surface:#FFFFFF; --surface-2:#EFEBE0; --text:#171B15; --text-dim:#5B6058;
    --shadow:0 1px 0 rgba(0,0,0,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0E1410; --surface:#161D18; --surface-2:#1E2620; --text:#F2F1EA; --text-dim:#9AA39B; --line:rgba(247,245,239,0.12); --shadow:0 1px 0 rgba(0,0,0,0.4); }
  }
  :root[data-theme="dark"]{ --bg:#0E1410; --surface:#161D18; --surface-2:#1E2620; --text:#F2F1EA; --text-dim:#9AA39B; --line:rgba(247,245,239,0.12); --shadow:0 1px 0 rgba(0,0,0,0.4); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{color:var(--text);font-family:'Source Sans 3',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.disp{font-family:'Barlow Condensed',system-ui,sans-serif;font-weight:700;letter-spacing:0.01em;}
  #app{max-width:920px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  .topbar{background:linear-gradient(180deg,var(--navy),#0A0D10);color:var(--chalk);padding:14px 16px 0 16px;position:sticky;top:0;z-index:20;}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1;}
  .falling-leaves{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;}
  .falling-leaf{position:absolute;top:-24px;width:13px;height:13px;opacity:0;animation:leaffall linear infinite;}
  .falling-leaf svg{width:100%;height:100%;display:block;}
  @keyframes leaffall{
    0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:0;}
    8%{opacity:0.8;}
    92%{opacity:0.8;}
    100%{transform:translateY(135px) translateX(22px) rotate(320deg);opacity:0;}
  }
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand .mark{font-family:'Barlow Condensed';font-weight:800;font-size:22px;letter-spacing:0.02em;
    background:linear-gradient(90deg,#E8A33D 0%,#D4692F 55%,#B3391D 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    -webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,0.2));}
  .leaf-accent{display:inline-block;width:16px;height:16px;vertical-align:-2px;margin:0 2px;flex-shrink:0;}
  .leaf-accent svg{width:100%;height:100%;display:block;}
  .brand .sub{font-size:12px;color:#9DA79E;}
  .user-chip{font-size:13px;color:#C9CFC7;background:rgba(255,255,255,0.06);padding:6px 10px;border-radius:3px;border:1px solid rgba(255,255,255,0.1);cursor:pointer;}
  .tabs{display:flex;gap:2px;overflow-x:auto;margin-top:12px;scrollbar-width:none;position:relative;z-index:1;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{background:none;border:none;color:#8B958C;font-family:'Barlow Condensed';font-size:16px;font-weight:600;padding:10px 12px;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;}
  .tab-btn.active{color:var(--chalk);border-bottom-color:var(--gold);}
  .tab-btn:hover{color:var(--chalk);}
  main{flex:1;padding:16px 16px 60px 16px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card-title{font-size:20px;margin:0 0 4px 0;}
  .card-sub{font-size:13px;color:var(--text-dim);margin:0 0 14px 0;}
  .yard-divider{border:none;border-top:1px dashed var(--line);margin:14px 0;}
  button{font-family:inherit;cursor:pointer;}
  .btn{background:var(--field);color:var(--chalk);border:none;border-radius:3px;padding:10px 16px;font-size:14px;font-weight:600;font-family:'Source Sans 3';}
  .btn:hover{background:var(--field-dark);}
  .btn.gold{background:var(--gold);color:#231A02;}
  .btn.gold:hover{filter:brightness(0.95);}
  .btn.ghost{background:transparent;color:var(--field);border:1px solid var(--field);}
  :root[data-theme="dark"] .btn.ghost{color:var(--chalk);border-color:var(--line);}
  @media (prefers-color-scheme:dark){ .btn.ghost{color:var(--chalk);border-color:var(--line);} }
  .btn.danger{background:var(--red);color:#fff;}
  .btn.sm{padding:6px 10px;font-size:12.5px;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  input,select,textarea{font-family:'Source Sans 3';font-size:15px;padding:9px 10px;border-radius:3px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);width:100%;}
  label{font-size:12.5px;color:var(--text-dim);display:block;margin:10px 0 4px 0;}
  .field{margin-bottom:2px;}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  .error{color:var(--red);font-size:13px;margin-top:8px;}
  .notice{background:var(--surface-2);border-left:3px solid var(--gold);padding:8px 12px;font-size:13px;border-radius:2px;margin-bottom:12px;color:var(--text-dim);}
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
  .login-card{max-width:380px;width:100%;}
  .login-tabs{display:flex;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .login-tab{flex:1;text-align:center;padding:10px;font-family:'Barlow Condensed';font-size:17px;font-weight:600;color:var(--text-dim);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
  .login-tab.active{color:var(--text);border-bottom-color:var(--gold);}
  .game{border:1px solid var(--line);border-radius:4px;margin-bottom:10px;overflow:hidden;}
  .game-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface-2);font-size:12px;color:var(--text-dim);}
  .game-body{padding:12px;}
  .matchup{display:flex;gap:8px;align-items:stretch;}
  .team-btn{flex:1;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:3px;background:var(--surface);display:flex;flex-direction:column;gap:2px;}
  .team-btn .name{font-family:'Barlow Condensed';font-weight:700;font-size:17px;}
  .team-btn .spread{font-size:12.5px;color:var(--text-dim);}
  .team-btn.selected{background:var(--field);border-color:var(--field);}
  .team-btn.selected .name,.team-btn.selected .spread{color:var(--chalk);}
  .modifiers{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .chip{font-size:12px;padding:6px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2);color:var(--text-dim);}
  .chip.on{background:var(--gold);color:#231A02;border-color:var(--gold);font-weight:600;}
  .pts-badge{font-family:'Barlow Condensed';font-weight:700;font-size:13px;background:var(--navy);color:var(--gold);padding:3px 8px;border-radius:3px;}
  .result-tag{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:3px;text-transform:uppercase;letter-spacing:0.03em;}
  .result-tag.win{background:#DCEEDF;color:#1B4332;}
  .result-tag.loss{background:#F6DEDC;color:var(--red);}
  .result-tag.push{background:var(--surface-2);color:var(--text-dim);}
  .result-tag.locked-tag{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--line);}
  :root[data-theme="dark"] .result-tag.win{background:#173323;}
  :root[data-theme="dark"] .result-tag.loss{background:#3A1613;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-family:'Barlow Condensed';font-size:13px;color:var(--text-dim);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);}
  td{padding:9px 8px;border-bottom:1px solid var(--line);}
  tr.me{background:rgba(212,167,63,0.12);}
  .rank{font-family:'Barlow Condensed';font-weight:700;font-size:16px;color:var(--text-dim);}
  .pts-cell{font-family:'Barlow Condensed';font-weight:700;font-size:17px;}
  .pts-cell.pos{color:var(--field);}
  .pts-cell.neg{color:var(--red);}
  .toggle-group{display:flex;gap:2px;margin-bottom:14px;background:var(--surface-2);border-radius:3px;padding:2px;width:fit-content;}
  .toggle-group button{background:none;border:none;padding:7px 14px;font-family:'Barlow Condensed';font-weight:600;font-size:14px;color:var(--text-dim);border-radius:2px;}
  .toggle-group button.active{background:var(--field);color:var(--chalk);}
  .log-entry{border-bottom:1px solid var(--line);padding:10px 0;}
  .log-entry:last-child{border-bottom:none;}
  .log-ts{font-size:11.5px;color:var(--text-dim);}
  .log-desc{font-size:14px;margin-top:2px;}
  .empty{text-align:center;padding:40px 16px;color:var(--text-dim);}
  .live-dot{width:6px;height:6px;border-radius:50%;background:#fff;display:inline-block;animation:livepulse 1.1s ease-in-out infinite;}
  @keyframes livepulse{0%,100%{opacity:1;}50%{opacity:0.25;}}
  .empty .disp{font-size:22px;color:var(--text);margin-bottom:6px;}
  .espn-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .espn-row input[type=checkbox]{width:auto;}
  .espn-row .g-teams{flex:1;}
  .espn-row .g-spread{color:var(--text-dim);font-size:12.5px;}
  .espn-row .g-pts{width:64px;}
  ::selection{background:var(--gold);color:#231A02;}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  @media (max-width:480px){ .matchup{flex-direction:column;} .row{flex-direction:column;} }
</style>

<body>
<div id="app"></div>

<script>
(function(){
"use strict";

/* ====================== SUPABASE CONFIG ======================
   Dedicated Supabase project for Bool Bloods (separate from the
   golf pool project). Run the SQL block at the bottom of this file
   (in comments) once in this project's SQL editor before first use. */
const SB_URL = "https://yklqugyhspohksclyrsa.supabase.co";
const SB_KEY = "sb_publishable_cz_OF-A1UI_QUxzxYmf7Eg_0BiFjSZF";

async function sb(path, opts={}){
  const res = await fetch(SB_URL+path, {
    ...opts,
    headers: {
      "apikey": SB_KEY, "Authorization": "Bearer "+SB_KEY, "Content-Type": "application/json",
      "Prefer": opts.prefer || "", ...(opts.headers||{})
    }
  });
  if(!res.ok){ console.error("Supabase error", res.status, await res.text().catch(()=>"")); throw new Error("Supabase request failed ("+res.status+")"); }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

const LEAGUE_ID = 1; // single-row config table

// ---------- helpers ----------
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function esc(s){ return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtTs(ts){ const d = new Date(ts); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " " + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function localGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function localSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function localDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

const SPORT_LABELS = {ncaaf:"NCAAF", nfl:"NFL"};
const LEAF_SVG = `<span class="leaf-accent"><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#D4692F" d="M27 5C18 3 7 8 5 17c-2 8 5 14 12 10 9-5 12-16 10-22z"/><path d="M10 24 22 8" stroke="#7A2E10" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></span>`;
function fallingLeafSvg(color, vein){
  return `<svg viewBox="0 0 32 32" aria-hidden="true"><path fill="${color}" d="M27 5C18 3 7 8 5 17c-2 8 5 14 12 10 9-5 12-16 10-22z"/><path d="M10 24 22 8" stroke="${vein}" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>`;
}
const FALLING_LEAVES_CONFIG = [
  {left:6,  delay:0.0, dur:6.5, size:12, color:"#D4692F", vein:"#7A2E10"},
  {left:20, delay:2.2, dur:7.5, size:10, color:"#D4A73F", vein:"#8A6A1F"},
  {left:35, delay:4.1, dur:6.0, size:13, color:"#B3391D", vein:"#5E1E0F"},
  {left:52, delay:1.3, dur:7.0, size:11, color:"#E8A33D", vein:"#8A6A1F"},
  {left:68, delay:5.0, dur:6.8, size:12, color:"#D4692F", vein:"#7A2E10"},
  {left:82, delay:2.9, dur:7.2, size:10, color:"#B3391D", vein:"#5E1E0F"},
  {left:93, delay:0.7, dur:6.4, size:13, color:"#D4A73F", vein:"#8A6A1F"},
];
const FALLING_LEAVES_HTML = `<div class="falling-leaves">${FALLING_LEAVES_CONFIG.map(l=>
  `<span class="falling-leaf" style="left:${l.left}%;width:${l.size}px;height:${l.size}px;animation-delay:${l.delay}s;animation-duration:${l.dur}s;">${fallingLeafSvg(l.color,l.vein)}</span>`
).join("")}</div>`;
function weekLabel(week){ return week ? SPORT_LABELS[week.sport]+" Week "+week.week_num : ""; }
function weekOptionLabel(id){ const w=STATE.weeks[id]; return weekLabel(w) + (w.finalized?" (locked)":" (draft)"); }

// ---------- state ----------
let STATE = { users:{}, owner:null, commissioners:[], weeks:{}, weekOrder:[], currentWeek:null, log:[] };
let ME = null;
let ROUTE = "picks";
let LOADING = true;
let AUTH_MODE = "login";
let AUTH_ERR = "";

// ---------- data access (Supabase) ----------
async function loadAll(){
  const [users, league, weeks, log] = await Promise.all([
    sb("/rest/v1/bb_users?select=*"),
    sb("/rest/v1/bb_league?id=eq."+LEAGUE_ID+"&select=*"),
    sb("/rest/v1/bb_weeks?select=*,bb_games(*)&order=created_at.asc"),
    sb("/rest/v1/bb_log?select=*&order=ts.desc&limit=300")
  ]);
  STATE.users = {};
  (users||[]).forEach(u=> STATE.users[u.username] = {email:u.email, passHash:u.pass_hash, joinedAt:u.joined_at});
  const lg = (league||[])[0];
  STATE.owner = lg ? lg.owner : null;
  STATE.commissioners = lg ? (lg.commissioners || (lg.commissioner ? [lg.commissioner] : [])) : [];
  STATE.currentWeek = lg ? lg.current_week : null;
  STATE.weeks = {}; STATE.weekOrder = [];
  (weeks||[]).forEach(w=>{
    STATE.weeks[w.id] = {
      sport:w.sport, week_num:w.week_num, finalized:w.finalized, locked:w.locked, created_at:w.created_at,
      games: (w.bb_games||[]).map(g=>({
        id:g.id, away:g.away, home:g.home, favorite:g.favorite, spread:Number(g.spread), points:Number(g.points),
        kickoff:g.kickoff, dayLabel:g.day_label, espnId:g.espn_id,
        sport: g.sport || w.sport, espnWeekNum: g.espn_week_num!=null ? g.espn_week_num : w.week_num,
        result: g.has_result ? {awayScore:g.away_score, homeScore:g.home_score} : null
      })).sort((a,b)=> (a.kickoff||"").localeCompare(b.kickoff||""))
    };
    STATE.weekOrder.push(w.id);
  });
  STATE.log = (log||[]).map(l=>({ts:new Date(l.ts).getTime(), actor:l.actor, action:l.action, detail:l.detail}));
}

async function ensureLeagueRow(){
  const existing = await sb("/rest/v1/bb_league?id=eq."+LEAGUE_ID+"&select=id");
  if(!existing || existing.length===0){
    await sb("/rest/v1/bb_league", {method:"POST", prefer:"return=minimal", body: JSON.stringify({id:LEAGUE_ID, owner:null, commissioners:[], current_week:null})});
  }
}
async function patchLeague(fields){
  await sb("/rest/v1/bb_league?id=eq."+LEAGUE_ID, {method:"PATCH", prefer:"return=minimal", body: JSON.stringify(fields)});
}

async function loadPicksFor(weekId, username){
  const rows = await sb("/rest/v1/bb_picks?week_id=eq."+encodeURIComponent(weekId)+"&username=eq."+encodeURIComponent(username)+"&select=picks");
  const picks = (rows && rows[0]) ? rows[0].picks : {};
  return resolveStarConflict(picks, weekId);
}
// Auto-heals any leftover multi-star data (e.g. saved before the one-star limit
// existed) the moment it's loaded, for everyone, with no action needed from them.
// Prefers keeping the star on whichever game already locked — that one is
// permanent and shouldn't silently move to a still-open game.
function resolveStarConflict(picks, weekId){
  const week = STATE.weeks[weekId];
  if(!week) return picks;
  const starredIds = week.games.filter(g=>picks[g.id] && picks[g.id].star).map(g=>g.id);
  if(starredIds.length<=1) return picks;
  const lockedId = starredIds.find(id=>{ const g=week.games.find(x=>x.id===id); return isGameLocked(g,week); });
  const keepId = lockedId || starredIds[0];
  starredIds.forEach(id=>{ if(id!==keepId) picks[id].star=false; });
  return picks;
}
async function savePicksFor(weekId, username, picks){
  await sb("/rest/v1/bb_picks", {
    method:"POST", prefer:"resolution=merge-duplicates,return=minimal",
    body: JSON.stringify({week_id:weekId, username, picks, updated_at:new Date().toISOString()})
  });
}

async function loadAdjustment(weekId, username){
  const rows = await sb("/rest/v1/bb_adjustments?week_id=eq."+encodeURIComponent(weekId)+"&username=eq."+encodeURIComponent(username)+"&select=amount,note");
  return (rows && rows[0]) ? {amount:Number(rows[0].amount)||0, note:rows[0].note||""} : {amount:0, note:""};
}
async function saveAdjustment(weekId, username, amount, note){
  await sb("/rest/v1/bb_adjustments", {
    method:"POST", prefer:"resolution=merge-duplicates,return=minimal",
    body: JSON.stringify({week_id:weekId, username, amount, note, updated_at:new Date().toISOString()})
  });
}

async function addLog(action, detail){
  const entry = {ts:Date.now(), actor:ME, action, detail};
  STATE.log.unshift(entry);
  await sb("/rest/v1/bb_log", {method:"POST", prefer:"return=minimal", body: JSON.stringify({actor:ME, action, detail})});
}

// ---------- ESPN live fetch ----------
function parseEspnOdds(comp, homeC, awayC){
  const oddsArr = comp.odds || [];
  if(!oddsArr.length) return null;
  const o = oddsArr[0];
  let favorite = null, spread = null;
  if(typeof o.spread === "number"){
    spread = Math.abs(o.spread);
    favorite = o.spread < 0 ? "home" : (o.spread > 0 ? "away" : "home");
  } else if(o.details){
    const m = o.details.match(/(-?\d+(\.\d+)?)/);
    if(m){
      spread = Math.abs(Number(m[1]));
      const favAbbr = o.details.split(" ")[0];
      favorite = (homeC && homeC.team && (homeC.team.abbreviation===favAbbr)) ? "home" : "away";
    }
  }
  if(spread==null) return null;
  return {favorite, spread};
}
async function fetchEspnSlate(sport, weekNum){
  const league = sport==="nfl" ? "nfl" : "college-football";
  const groups = sport==="ncaaf" ? "&groups=80" : "";
  const url = `https://site.api.espn.com/apis/site/v2/sports/football/${league}/scoreboard?week=${weekNum}&seasontype=2${groups}&limit=400`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("ESPN request failed ("+res.status+")");
  const data = await res.json();
  const events = data.events || [];
  return events.map(ev=>{
    const comp = ev.competitions && ev.competitions[0];
    if(!comp) return null;
    const competitors = comp.competitors || [];
    const homeC = competitors.find(c=>c.homeAway==="home");
    const awayC = competitors.find(c=>c.homeAway==="away");
    if(!homeC || !awayC) return null;
    const parsedOdds = parseEspnOdds(comp, homeC, awayC);
    const favorite = parsedOdds ? parsedOdds.favorite : "home";
    const spread = parsedOdds ? parsedOdds.spread : 0;
    return {
      espnId: ev.id,
      away: awayC.team ? (awayC.team.shortDisplayName||awayC.team.displayName) : "TBD",
      home: homeC.team ? (homeC.team.shortDisplayName||homeC.team.displayName) : "TBD",
      favorite, spread,
      kickoff: comp.date || ev.date || null,
      dayLabel: comp.date ? new Date(comp.date).toLocaleDateString(undefined,{weekday:"short"}) : ""
    };
  }).filter(Boolean);
}

// ---------- pick locking (Thu kickoff / Sat 11am CDT cutoff) ----------
function addDaysToYmd(ymd, days){
  const [y,m,d] = ymd.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d, 12, 0, 0));
  dt.setUTCDate(dt.getUTCDate()+days);
  return dt.getUTCFullYear()+"-"+String(dt.getUTCMonth()+1).padStart(2,"0")+"-"+String(dt.getUTCDate()).padStart(2,"0");
}
function chicagoInfo(dateObj){
  const wd = new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",weekday:"short"}).format(dateObj);
  const ymd = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit"}).format(dateObj);
  return {wd, ymd};
}
// Returns a Date for 11:00am CDT on the Saturday of this week's slate, or null if the
// week has no Thu/Fri/Sat games to anchor from (e.g. a Sun/Mon-only slate).
function weekSaturdayCutoff(week){
  if(week._satCutoffCached !== undefined) return week._satCutoffCached;
  const withKickoff = (week.games||[]).filter(g=>g.kickoff);
  if(!withKickoff.length){ week._satCutoffCached = null; return null; }
  const info = withKickoff.map(g=>({g, ...chicagoInfo(new Date(g.kickoff))}));
  let satYmd = (info.find(x=>x.wd==="Sat")||{}).ymd;
  if(!satYmd){
    const anchors = info.filter(x=>x.wd==="Thu"||x.wd==="Fri").sort((a,b)=>new Date(a.g.kickoff)-new Date(b.g.kickoff));
    if(!anchors.length){ week._satCutoffCached = null; return null; }
    const anchor = anchors[0];
    satYmd = addDaysToYmd(anchor.ymd, anchor.wd==="Thu"?2:1);
  }
  const cutoff = new Date(satYmd+"T11:00:00-05:00");
  week._satCutoffCached = cutoff;
  return cutoff;
}
function gameLockTime(g, week){
  const cutoff = weekSaturdayCutoff(week);
  const kickoffMs = g.kickoff ? new Date(g.kickoff).getTime() : Infinity;
  const cutoffMs = cutoff ? cutoff.getTime() : Infinity;
  return Math.min(kickoffMs, cutoffMs);
}
function isGameLocked(g, week){
  return Date.now() >= gameLockTime(g, week);
}

// ---------- ESPN result auto-sync ----------
const ESPN_SCORE_CACHE = {};
const ESPN_WINPROB_CACHE = {};
const LAST_POSSESSION_CACHE = {}; // espnId -> {possessionAbbr, possessionText} — carries over when ESPN briefly omits the possession team on a live game
async function fetchEspnWinProb(sport, espnId){
  const league = sport==="nfl" ? "nfl" : "college-football";
  const url = `https://site.api.espn.com/apis/site/v2/sports/football/${league}/summary?event=${espnId}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("ESPN request failed ("+res.status+")");
  const data = await res.json();
  // Prefer the live-updating win probability feed; fall back to the pregame predictor.
  let homePct = null, awayPct = null;
  const wp = data.winprobability;
  if(Array.isArray(wp) && wp.length){
    const last = wp[wp.length-1];
    if(last && last.homeWinPercentage!=null){ homePct = Math.round(last.homeWinPercentage*100); awayPct = 100-homePct; }
  }
  if(homePct==null && data.predictor && data.predictor.homeTeam){
    const h = Number(data.predictor.homeTeam.gameProjection);
    if(!isNaN(h)){ homePct = Math.round(h); awayPct = 100-homePct; }
  }
  let result = homePct==null ? null : {homeWinPct:homePct, awayWinPct:awayPct};
  // Best-effort: real ATS cover probability, from a different ESPN domain than
  // everything else in this app. Not guaranteed to work or be populated — if it
  // fails or comes back empty, we just don't show it. Never fabricated.
  try{
    const coverPct = await fetchEspnCoverProb(sport, espnId);
    if(coverPct && result) result = {...result, ...coverPct};
    else if(coverPct) result = coverPct;
  }catch(e){}
  // Best-effort: fuller situation data (possession team + side, yard line, down/distance) read
  // from this same per-game summary payload — used as a fallback when the batched scoreboard
  // feed (fetchEspnScores, one call covering the whole week) leaves situation.possession out
  // for this particular game, which ESPN does for some games even while yardLine is present.
  try{
    const situationFallback = extractEspnSituation(data);
    if(situationFallback) result = result ? {...result, situationFallback} : {situationFallback};
  }catch(e){}
  return result;
}
function extractEspnSituation(data){
  const headerComp = data.header && data.header.competitions && data.header.competitions[0];
  const situation = (headerComp && headerComp.situation) || data.situation || null;
  if(!situation) return null;
  const competitors = (headerComp && headerComp.competitors) || [];
  const homeC = competitors.find(c=>c.homeAway==="home");
  const awayC = competitors.find(c=>c.homeAway==="away");
  let possessionSide = null, possessionAbbr = null;
  if(situation.possession){
    if(homeC && String(homeC.id)===String(situation.possession)){ possessionSide="home"; possessionAbbr = homeC.team ? (homeC.team.abbreviation||homeC.team.shortDisplayName) : null; }
    else if(awayC && String(awayC.id)===String(situation.possession)){ possessionSide="away"; possessionAbbr = awayC.team ? (awayC.team.abbreviation||awayC.team.shortDisplayName) : null; }
  }
  if(situation.yardLine==null && !situation.possessionText && !possessionSide) return null;
  return {
    yardLine: situation.yardLine!=null ? situation.yardLine : null,
    possessionText: situation.possessionText || null,
    possessionAbbr,
    possessionSide,
    isRedZone: !!situation.isRedZone,
    downDistanceText: situation.shortDownDistanceText || situation.downDistanceText || null,
  };
}
async function fetchEspnCoverProb(sport, espnId){
  const league = sport==="nfl" ? "nfl" : "college-football";
  const url = `https://sports.core.api.espn.com/v2/sports/football/leagues/${league}/events/${espnId}/competitions/${espnId}/probabilities?limit=300`;
  const res = await fetch(url);
  if(!res.ok) return null;
  const data = await res.json();
  const items = data.items || [];
  if(!items.length) return null;
  const latest = items[items.length-1];
  if(latest.spreadCoverProbHome==null) return null;
  const homeCoverPct = Math.round(latest.spreadCoverProbHome*100);
  const pushPct = Math.round((latest.spreadPushProb||0)*100);
  const awayCoverPct = 100 - homeCoverPct - pushPct;
  // ESPN sometimes leaves this at a flat 0 when it isn't actually populated
  // for a given game — treat that as "no real data" rather than show a fake 0%.
  if(homeCoverPct===0 && awayCoverPct===0) return null;
  return {homeCoverPct, awayCoverPct};
}
async function getWinProbCached(sport, espnId, forceRefresh){
  const key = sport+":"+espnId;
  const c = ESPN_WINPROB_CACHE[key];
  if(!forceRefresh && c && (Date.now()-c.ts) < 20000) return c.data;
  const data = await fetchEspnWinProb(sport, espnId);
  ESPN_WINPROB_CACHE[key] = {ts:Date.now(), data};
  return data;
}
async function fetchEspnScores(sport, weekNum){
  const league = sport==="nfl" ? "nfl" : "college-football";
  const groups = sport==="ncaaf" ? "&groups=80" : "";
  const url = `https://site.api.espn.com/apis/site/v2/sports/football/${league}/scoreboard?week=${weekNum}&seasontype=2${groups}&limit=400`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("ESPN request failed ("+res.status+")");
  const data = await res.json();
  const map = {};
  (data.events||[]).forEach(ev=>{
    const comp = ev.competitions && ev.competitions[0];
    if(!comp) return;
    const competitors = comp.competitors || [];
    const homeC = competitors.find(c=>c.homeAway==="home");
    const awayC = competitors.find(c=>c.homeAway==="away");
    const statusType = comp.status && comp.status.type;
    const completed = !!(statusType && statusType.completed);
    const state = statusType ? statusType.state : "pre"; // 'pre' | 'in' | 'post'
    const detail = statusType ? (statusType.shortDetail || statusType.detail || "") : "";
    const period = comp.status ? comp.status.period : null;
    const displayClock = comp.status ? comp.status.displayClock : null;
    const situation = comp.situation || {};
    let possessionAbbr = null, possessionSide = null;
    if(situation.possession){
      if(homeC && String(homeC.id)===String(situation.possession)){ possessionSide = "home"; possessionAbbr = homeC.team ? (homeC.team.abbreviation||homeC.team.shortDisplayName) : null; }
      else if(awayC && String(awayC.id)===String(situation.possession)){ possessionSide = "away"; possessionAbbr = awayC.team ? (awayC.team.abbreviation||awayC.team.shortDisplayName) : null; }
    }
    let possessionText = situation.possessionText || null;
    if(state==="in"){
      // ESPN's batched scoreboard feed sometimes drops possession for a game entirely (not just
      // briefly) — fall back to the last value we actually saw for this game rather than showing
      // no team; the per-game summary fetch (fetchEspnWinProb) fills in a fuller fallback on top.
      if(possessionAbbr || possessionText || possessionSide){
        LAST_POSSESSION_CACHE[ev.id] = {possessionAbbr, possessionText, possessionSide};
      } else if(LAST_POSSESSION_CACHE[ev.id]){
        possessionAbbr = LAST_POSSESSION_CACHE[ev.id].possessionAbbr;
        possessionText = LAST_POSSESSION_CACHE[ev.id].possessionText;
        possessionSide = LAST_POSSESSION_CACHE[ev.id].possessionSide;
      }
    } else {
      delete LAST_POSSESSION_CACHE[ev.id];
    }
    map[ev.id] = { completed, state, detail, period, displayClock, possessionAbbr, possessionSide,
      homeId: homeC?homeC.id:null, awayId: awayC?awayC.id:null,
      yardLine: situation.yardLine!=null ? situation.yardLine : null,
      possessionText,
      isRedZone: !!situation.isRedZone,
      downDistanceText: situation.shortDownDistanceText || situation.downDistanceText || null,
      homeScore: homeC?Number(homeC.score):null, awayScore: awayC?Number(awayC.score):null };
  });
  return map;
}
async function getEspnScoresCached(sport, weekNum, forceRefresh){
  const key = sport+":"+weekNum;
  const c = ESPN_SCORE_CACHE[key];
  if(!forceRefresh && c && (Date.now()-c.ts) < 30000) return c.data;
  const data = await fetchEspnScores(sport, weekNum);
  ESPN_SCORE_CACHE[key] = {ts:Date.now(), data};
  return data;
}
// Fills in any missing results for a finalized week straight from ESPN. Never
// overwrites a result that's already been entered (manual corrections stick).
async function syncWeekResults(week){
  if(!week || !week.finalized) return false;
  const pending = (week.games||[]).filter(g=>!g.result && g.espnId);
  if(!pending.length) return false;
  const groups = {};
  pending.forEach(g=>{
    const sport = g.sport || week.sport;
    const wn = g.espnWeekNum!=null ? g.espnWeekNum : week.week_num;
    const key = sport+":"+wn;
    (groups[key] = groups[key] || {sport, wn, games:[]}).games.push(g);
  });
  let changed = false;
  for(const key of Object.keys(groups)){
    const {sport, wn, games} = groups[key];
    let scores;
    try{ scores = await getEspnScoresCached(sport, wn); }catch(e){ continue; }
    for(const g of games){
      const s = scores[g.espnId];
      if(s && s.completed && s.homeScore!=null && s.awayScore!=null){
        await sb("/rest/v1/bb_games?id=eq."+encodeURIComponent(g.id), {method:"PATCH", prefer:"return=minimal", body: JSON.stringify({away_score:s.awayScore, home_score:s.homeScore, has_result:true})});
        g.result = {awayScore:s.awayScore, homeScore:s.homeScore};
        changed = true;
      }
    }
  }
  return changed;
}

// ---------- grading (same rules as before) ----------
function marginForFavorite(game, scores){
  const s = scores || game.result;
  return game.favorite==="home" ? (s.homeScore-s.awayScore) : (s.awayScore-s.homeScore);
}
function coverResult(game, side, teaserAdj, scoresOverride){
  const scores = scoresOverride || game.result;
  if(!scores) return null;
  const marginFav = marginForFavorite(game, scores);
  const spread = Number(game.spread);
  if(side===game.favorite){
    const need = teaserAdj ? spread-6 : spread;
    if(marginFav>need) return "win"; if(marginFav===need) return "push"; return "loss";
  } else {
    const need = teaserAdj ? spread+6 : spread;
    if(marginFav<need) return "win"; if(marginFav===need) return "push"; return "loss";
  }
}
function scoreWeek(week, picks, adjustment){
  adjustment = adjustment || 0;
  let total=0, wins=0, losses=0, pushes=0; const perGame={}; const parlayGameIds=[]; const teaserGameIds=[];
  for(const g of week.games){
    const p = picks[g.id]; if(!p || !p.side) continue;
    const base = coverResult(g, p.side, false); let pts=0;
    if(base==="win"){ pts = p.star? g.points*2 : g.points; wins++; }
    else if(base==="loss"){ pts = p.star? -g.points*2 : 0; losses++; }
    else if(base==="push"){ pts=0; pushes++; }
    perGame[g.id] = {base, pts, bundlePts:0, side:p.side, star:!!p.star, parlay:!!p.parlay, teaser:!!p.teaser};
    total += pts;
    if(p.parlay) parlayGameIds.push(g.id);
    if(p.teaser) teaserGameIds.push(g.id);
  }
  const byKickoff = (a,b)=>{
    const ka = week.games.find(x=>x.id===a).kickoff, kb = week.games.find(x=>x.id===b).kickoff;
    if(!ka && !kb) return 0; if(!ka) return 1; if(!kb) return -1;
    return new Date(ka)-new Date(kb);
  };
  parlayGameIds.sort(byKickoff);
  teaserGameIds.sort(byKickoff);

  let parlayBonus=0, parlayStatus=null;
  if(parlayGameIds.length===3){
    const results = parlayGameIds.map(id=>{ const g=week.games.find(x=>x.id===id); return coverResult(g, picks[id].side, false); });
    if(results.some(r=>r==="loss")){ parlayStatus="miss"; }
    else if(results.some(r=>r===null)){ parlayStatus="pending"; }
    else if(results.every(r=>r==="win")){
      parlayBonus=3; parlayStatus="hit";
      const lastLeg = parlayGameIds[parlayGameIds.length-1];
      perGame[lastLeg].bundlePts += 3;
    }
    else parlayStatus="miss";
  }
  let teaserBonus=0, teaserStatus=null;
  if(teaserGameIds.length===1){
    const g = week.games.find(x=>x.id===teaserGameIds[0]);
    const r = coverResult(g, picks[teaserGameIds[0]].side, true);
    if(r==="loss"){ teaserBonus=-2; teaserStatus="miss"; perGame[teaserGameIds[0]].bundlePts += -2; }
    else teaserStatus="pending";
  } else if(teaserGameIds.length===2){
    const [legA, legB] = teaserGameIds;
    const gA = week.games.find(x=>x.id===legA), gB = week.games.find(x=>x.id===legB);
    const rA = coverResult(gA, picks[legA].side, true);
    if(rA==="loss"){
      teaserBonus=-2; teaserStatus="miss"; perGame[legA].bundlePts += -2;
    } else {
      const rB = coverResult(gB, picks[legB].side, true);
      if(rB==null){ teaserStatus="pending"; }
      else if(rA==="win" && rB==="win"){ teaserBonus=2; teaserStatus="hit"; perGame[legB].bundlePts += 2; }
      else { teaserBonus=-2; teaserStatus="miss"; perGame[legB].bundlePts += -2; }
    }
  }
  total += parlayBonus + teaserBonus;
  total += adjustment;
  return {total, wins, losses, pushes, perGame, parlayBonus, parlayStatus, teaserBonus, teaserStatus, parlayGameIds, teaserGameIds, adjustment};
}

      ${respectLock?`<button class="btn ghost sm" id="refresh-scores-btn" style="margin-bottom:10px;">↻ Refresh scores</button>`:""}
      <div id="games-list"></div>
      ${editable?`<button class="btn gold" id="save-picks-btn" style="width:100%;margin-top:6px;">Save picks</button><button class="btn ghost sm" id="cancel-picks-btn" style="width:100%;margin-top:8px;">Cancel</button><div id="save-msg" style="font-size:13px;margin-top:8px;"></div>`:""}
    </div>`;
  const list = document.getElementById("games-list");
  list.innerHTML = week.games.map(g=>{
    const locked = respectLock && isGameLocked(g,week);
    return gameCardHtml(g, picks[g.id]||{}, editable && !locked, locked);
  }).join("");
  const refreshBtn = document.getElementById("refresh-scores-btn");
  if(refreshBtn) refreshBtn.onclick = async ()=>{
    refreshBtn.textContent = "Checking ESPN…"; refreshBtn.disabled = true;
    try{ await syncWeekResults(week); }catch(e){}
    renderPickGames(main, week, weekId, picks, forUser, editable, respectLock, useSummaryFlow);
  };
  if(editable){
    week.games.forEach(g=>{
      const locked = respectLock && isGameLocked(g,week);
      if(locked) return;
      const el = document.getElementById("game-"+g.id); if(!el) return;
      el.querySelectorAll(".team-btn").forEach(btn=>{
        btn.onclick = ()=>{ const side=btn.dataset.side; picks[g.id]=picks[g.id]||{}; picks[g.id].side = picks[g.id].side===side?null:side; renderPickGames(main, week, weekId, picks, forUser, editable, respectLock, useSummaryFlow); };
      });
      el.querySelectorAll(".chip").forEach(chip=>{
        chip.onclick = ()=>{
          picks[g.id]=picks[g.id]||{};
          const key=chip.dataset.mod;
          const turningOn = !picks[g.id][key];
          if(key==="star" && turningOn){
            // Only one star allowed per week. If the current star is already on a
            // locked (started) game, it's permanent — can't be moved anymore, only
            // Time Travel (respectLock=false) can override that.
            const existingId = Object.keys(picks).find(gid=>picks[gid] && picks[gid].star);
            if(existingId && existingId!==g.id){
              const existingGame = week.games.find(x=>x.id===existingId);
              if(respectLock && existingGame && isGameLocked(existingGame, week)){
                alert(`Your star is already locked in on ${existingGame.away} @ ${existingGame.home} — it can't move once that game has started.`);
                return;
              }
            }
            Object.values(picks).forEach(p=>{ if(p) p.star=false; });
          }
          picks[g.id][key]=turningOn;
          renderPickGames(main, week, weekId, picks, forUser, editable, respectLock, useSummaryFlow);
        };
      });
    });
    document.getElementById("save-picks-btn").onclick = async ()=>{
      const validIds = new Set(week.games.map(g=>g.id));
      const clean={}; for(const [gid,p] of Object.entries(picks)){ if(p && p.side && validIds.has(gid)) clean[gid]=p; }
      // Safety net: collapse any leftover multi-star data (e.g. from before this
      // limit existed) down to one. Prefer keeping the star on whichever game already
      // locked (started) — that one is permanent and shouldn't get silently moved.
      const starredIds = week.games.filter(g=>clean[g.id] && clean[g.id].star).map(g=>g.id);
      if(starredIds.length>1){
        const lockedId = respectLock ? starredIds.find(id=>{ const g=week.games.find(x=>x.id===id); return isGameLocked(g,week); }) : null;
        const keepId = lockedId || starredIds[0];
        starredIds.forEach(id=>{ if(id!==keepId) clean[id].star=false; });
      }
      await savePicksFor(weekId, forUser, clean);
      await logPickActivity(weekId, forUser, Object.keys(clean).length, forUser===ME ? forUser : ME);
      if(useSummaryFlow){
        PICKS_VIEW_MODE = "summary";
        renderPickGames(main, week, weekId, clean, forUser, editable, respectLock, useSummaryFlow);
      } else {
        document.getElementById("save-msg").textContent = "Saved.";
        document.getElementById("save-msg").style.color = "var(--field)";
      }
    };
    const cancelBtn = document.getElementById("cancel-picks-btn");
    if(cancelBtn) cancelBtn.onclick = async ()=>{
      if(useSummaryFlow){
        await renderPicksPage(main);
      } else {
        await renderTimeTravel(main);
      }
    };
  }
}

async function fetchLiveWinProbs(week, picks, liveScores){
  const winProbMap = {};
  const liveGames = week.games.filter(g=> picks[g.id] && picks[g.id].side && g.espnId && liveScores[g.espnId] && liveScores[g.espnId].state==="in");
  await Promise.all(liveGames.map(async g=>{
    try{ winProbMap[g.espnId] = await getWinProbCached(g.sport || week.sport, g.espnId); }catch(e){}
  }));
  return winProbMap;
}

async function fetchLiveScoresForWeek(week, forceRefresh){
  const groups = {};
  (week.games||[]).forEach(g=>{
    const sport = g.sport || week.sport;
    const wn = g.espnWeekNum!=null ? g.espnWeekNum : week.week_num;
    groups[sport+":"+wn] = {sport, wn};
  });
  const merged = {};
  await Promise.all(Object.values(groups).map(async ({sport,wn})=>{
    try{ Object.assign(merged, await getEspnScoresCached(sport, wn, forceRefresh)); }catch(e){}
  }));
  return merged;
}

async function renderPicksSummary(main, week, weekId, picks, forUser, respectLock){
  const parlayCount = countMods(picks,"parlay",week); const teaserCount = countMods(picks,"teaser",week);
  const pickedCount = week.games.filter(g=>picks[g.id] && picks[g.id].side).length;
  main.innerHTML = `
    <div class="card">
      <h2 class="card-title">${esc(weekLabel(week))}</h2>
      <p class="card-sub">${pickedCount}/${week.games.length} games picked · Parlay ${parlayCount}/3 · Teaser ${teaserCount}/2</p>
      ${respectLock?`<button class="btn ghost sm" id="summary-refresh-btn" style="margin-bottom:10px;">↻ Refresh live scores</button>`:""}
      <div id="summary-list"></div>
      <button class="btn gold" id="edit-picks-btn" style="width:100%;margin-top:10px;">Edit picks</button>
    </div>`;
  let liveScores = {}, winProbMap = {};
  if(respectLock){
    try{ liveScores = await fetchLiveScoresForWeek(week); }catch(e){}
    try{ winProbMap = await fetchLiveWinProbs(week, picks, liveScores); }catch(e){}
  }
  renderPicksSummaryList(week, weekId, picks, respectLock, liveScores, winProbMap);
  const refreshBtn = document.getElementById("summary-refresh-btn");
  const doRefresh = async (manual)=>{
    if(manual){ refreshBtn.textContent = "Checking ESPN…"; refreshBtn.disabled = true; }
    try{ await syncWeekResults(week); }catch(e){}
    try{ liveScores = await fetchLiveScoresForWeek(week, true); }catch(e){}
    try{ winProbMap = await fetchLiveWinProbs(week, picks, liveScores); }catch(e){}
    renderPicksSummaryList(week, weekId, picks, respectLock, liveScores, winProbMap);
    if(manual){ refreshBtn.textContent = "↻ Refresh live scores"; refreshBtn.disabled = false; }
  };
  if(refreshBtn) refreshBtn.onclick = ()=> doRefresh(true);
  // Auto-refresh every 20s while this summary is open and at least one picked game hasn't
  // gotten a result yet — keeps score, clock, quarter and the field-position bar moving on
  // their own instead of requiring a manual tap. Stops itself once every picked game is final,
  // and gets cleared whenever the user navigates away (renderMain / renderPickGames).
  if(respectLock){
    const hasUnresolved = week.games.some(g=> picks[g.id] && picks[g.id].side && g.espnId && !g.result);
    if(hasUnresolved) LIVE_POLL_TIMER = setInterval(()=>{ doRefresh(false); }, 20000);
  }
  document.getElementById("edit-picks-btn").onclick = ()=>{
    PICKS_VIEW_MODE = "edit";
    renderPickGames(main, week, weekId, picks, forUser, true, respectLock, true);
  };
}

function formatKickoffCentral(iso){
  if(!iso) return "Kickoff TBD";
  const d = new Date(iso);
  return new Intl.DateTimeFormat("en-US", {timeZone:"America/Chicago", weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit", timeZoneName:"short"}).format(d);
}
function quarterLabel(period){
  if(period==null) return "—";
  if(period<=4) return "Q"+period;
  return period===5 ? "OT" : "OT"+(period-4);
}
function fieldPositionBar(live, awayName, homeName){
  if(live.yardLine==null) return "";
  // ESPN's situation.yardLine is always measured from the HOME team's own goal line:
  // 0 = home's own goal, 100 = away's own goal — regardless of who has the ball.
  const pct = Math.max(0, Math.min(100, live.yardLine));
  // "at TEAM ##" only describes whose side of the field the ball is on, NOT who has it —
  // ESPN's own convention is field position labeled by territory, so a team can be shown
  // "at [opponent] 19" while the OTHER team is actually on offense. Show who has the ball
  // as its own explicit line so it's never ambiguous.
  const fieldLabel = live.possessionText || (live.possessionAbbr!=null ? `${live.possessionAbbr} ${Math.round(live.possessionSide==="away" ? 100-pct : pct)}` : null);
  const offenseName = live.possessionSide==="home" ? homeName : live.possessionSide==="away" ? awayName : null;
  const accent = live.isRedZone ? "#ef4444" : "#5b8def";
  // Fill from the possessing team's own goal line up to their current spot, so the empty
  // track always shows exactly how much field is left between them and the end zone
  // they're driving toward — never anything filled beyond the marker.
  let fillLeft, fillWidth;
  if(live.possessionSide==="away"){ fillLeft = pct; fillWidth = 100-pct; }
  else { fillLeft = 0; fillWidth = pct; } // home possession, or unknown side defaults to this
  const gradientDir = live.possessionSide==="away" ? "to left" : "to right";
  const label = [offenseName?`🏈 ${esc(offenseName)}`:"", fieldLabel?esc(fieldLabel):""].filter(Boolean).join(" — ");
  return `
    <div style="margin-top:7px;">
      ${label?`<div style="text-align:center;font-family:'Barlow Condensed';font-weight:800;font-size:15px;letter-spacing:0.02em;color:${accent};">${label}</div>`:""}
      <div style="position:relative;height:14px;margin-top:${label?"5px":"0"};">
        <div style="position:absolute;top:6px;left:0;right:0;height:2px;border-radius:1px;
          background-color:var(--line);
          background-image:repeating-linear-gradient(to right, rgba(255,255,255,0.35) 0, rgba(255,255,255,0.35) 1px, transparent 1px, transparent 4%);"></div>
        <div style="position:absolute;top:6px;left:${fillLeft}%;height:2px;width:${fillWidth}%;border-radius:1px;
          background:linear-gradient(${gradientDir}, transparent, ${accent});"></div>
        <div style="position:absolute;top:1px;left:${pct}%;width:2px;height:12px;border-radius:1px;background:${accent};transform:translateX(-1px);box-shadow:0 0 6px ${accent};"></div>
      </div>
    </div>`;
}
let EXPANDED_STATS_GAME = null;
async function loadAllPicksForWeek(weekId){

function renderPicksSummaryList(week, weekId, picks, respectLock, liveScores, winProbMap){

          let out = "";
          if(wp){

            out += `<div style="font-size:11.5px;color:var(--text-dim);margin-top:4px;">ESPN win probability for ${esc(sideTeam)}: <strong style="color:var(--text);">${pctForSide}%</strong> <span style="opacity:0.75;">(to win the game outright — not spread-adjusted)</span></div>`;
            if(wp.homeCoverPct!=null){
              const coverPct = p.side==="home" ? wp.homeCoverPct : wp.awayCoverPct;
              out += `<div style="font-size:11.5px;color:var(--gold);margin-top:2px;">ESPN cover probability for ${esc(sideTeam)}: <strong>${coverPct}%</strong> <span style="opacity:0.75;">(to cover ${spreadTxt})</span></div>`;

    const isFinal = !!g.result;
    const tagLabel = cover ? (isFinal ? cover : (cover==="win"?"winning":cover==="loss"?"losing":cover)) : null;
    const teaserLegAlreadyLost = p.teaser && g.result && coverResult(g,p.side,true)==="loss";

    return `<div id="summary-row-${g.id}" style="padding:9px 12px;margin:0 -12px;border-bottom:1px solid var(--line);${rowBg?`background:${rowBg};border-radius:3px;`:""}${started?"cursor:pointer;":""}" ${started?`data-stats-toggle="${g.id}"`:""}>

  list.querySelectorAll("[data-stats-toggle]").forEach(row=>{

      EXPANDED_STATS_GAME = (EXPANDED_STATS_GAME===gid) ? null : gid;
      renderPicksSummaryList(week, weekId, picks, respectLock, liveScores, winProbMap);
      if(EXPANDED_STATS_GAME!==gid) return;
      const panel = document.getElementById("stats-"+gid);

        const allPicks = await loadAllPicksForWeek(weekId);
        const usernames = Object.keys(STATE.users);
        const totalMembers = usernames.length;
        const homeVoters = [], awayVoters = [];
        allPicks.forEach(row2=>{
          const gp = row2.picks ? row2.picks[gid] : null;
          if(gp && gp.side==="home") homeVoters.push(row2.username);
          else if(gp && gp.side==="away") awayVoters.push(row2.username);
        });
        const pct = n => totalMembers ? Math.round((n/totalMembers)*100) : 0;
        panel.innerHTML = `
          <div style="padding-top:8px;border-top:1px dashed var(--line);margin-top:6px;">
            <div style="font-size:13px;margin-bottom:4px;"><strong>${esc(g.away)}</strong>: ${awayVoters.length} pick${awayVoters.length===1?"":"s"} (${pct(awayVoters.length)}% of pool)</div>
            <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">${awayVoters.length?awayVoters.map(esc).join(", "):"—"}</div>
            <div style="font-size:13px;margin-bottom:4px;"><strong>${esc(g.home)}</strong>: ${homeVoters.length} pick${homeVoters.length===1?"":"s"} (${pct(homeVoters.length)}% of pool)</div>
            <div style="font-size:12px;color:var(--text-dim);">${homeVoters.length?homeVoters.map(esc).join(", "):"—"}</div>
          </div>`;
      }catch(err){
        panel.innerHTML = `<div style="font-size:12px;color:var(--red);padding-top:6px;">Couldn't load pool picks.</div>`;
      }
    };
  });
}
function gameCardHtml(g, pick, editable, locked){
  const spreadTxt = `-${g.spread}`;
  const result = g.result;
  const awayCover = result ? coverResult(g,"away",false) : null;
  const homeCover = result ? coverResult(g,"home",false) : null;
  const teaserLegAlreadyLost = pick && pick.teaser && g.result && coverResult(g,pick.side,true)==="loss";
  return `
    <div class="game" id="game-${g.id}">
      <div class="game-head">
        <span>${esc(g.dayLabel||"")} ${g.kickoff?"· "+new Date(g.kickoff).toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'}):""}</span>
        <span style="display:flex;gap:6px;align-items:center;">${locked?`<span class="result-tag locked-tag">🔒 LOCKED</span>`:""}<span class="pts-badge">${pick && pick.star ? `${g.points*2} PTS (★×2)` : `${g.points} PT${g.points===1?"":"S"}`}</span></span>
      </div>
      ${(g.result && pick && pick.side)?`<div style="padding:0 12px 8px 12px;font-size:12px;color:var(--text-dim);">Scored: ${(()=>{ const c=coverResult(g,pick.side,false); const raw = c==="win"?g.points:c==="loss"?0:0; const actual = pick.star ? (c==="win"?g.points*2:c==="loss"?-g.points*2:0) : raw; return `${actual>0?"+":""}${actual} pts`+(pick.star?` (starred ${c})`:""); })()}</div>`:""}
      ${teaserLegAlreadyLost?`<div style="margin:0 12px 8px 12px;padding:8px 10px;background:rgba(179,38,30,0.15);border:1px solid var(--red);border-radius:3px;font-size:12px;color:var(--red);">⚠️ This leg already lost, even with the teaser's ±6 — the −2 is locked in right now. It stays −2 no matter what a second leg does, or whether you ever add one.</div>`:""}
      <div class="game-body">
        <div class="matchup">
          <button class="team-btn ${pick.side==='away'?'selected':''}" data-side="away" ${editable?"":"disabled"}>
            <span class="name">${esc(g.away)}</span><span class="spread">${g.favorite==='away'?spreadTxt:'+'+g.spread}</span>
            ${result?`<span class="result-tag ${awayCover}" style="margin-top:4px;width:fit-content;">${awayCover}</span>`:""}
          </button>
          <button class="team-btn ${pick.side==='home'?'selected':''}" data-side="home" ${editable?"":"disabled"}>
            <span class="name">${esc(g.home)}</span><span class="spread">${g.favorite==='home'?spreadTxt:'+'+g.spread}</span>
            ${result?`<span class="result-tag ${homeCover}" style="margin-top:4px;width:fit-content;">${homeCover}</span>`:""}
          </button>
        </div>
        <div class="modifiers">
          <button class="chip ${pick.star?'on':''}" data-mod="star" ${editable?"":"disabled"}>★ Star (×2 / −×2)</button>
          <button class="chip ${pick.parlay?'on':''}" data-mod="parlay" ${editable?"":"disabled"}>Parlay leg (+3 if 3/3)</button>
          <button class="chip ${pick.teaser?'on':''}" data-mod="teaser" ${editable?"":"disabled"}>Teaser leg (±6, ±2)</button>
        </div>
      </div>
    </div>`;
}

let LB_MODE="season", LB_WEEK=null, LB_PROJECTION="none"; // LB_PROJECTION: 'none' | 'score' | 'prob'

function buildHypoOutcomesFromLive(week, liveScores){
  const outcomes = {};
  week.games.forEach(g=>{
    if(g.result) return;
    const live = g.espnId ? liveScores[g.espnId] : null;
    if(live && live.state==="in" && live.homeScore!=null && live.awayScore!=null){
      const favCover = coverResult(g, g.favorite, false, live);
      if(favCover==="win") outcomes[g.id]="favorite";
      else if(favCover==="loss") outcomes[g.id]="dog";
      else if(favCover==="push") outcomes[g.id]="push";
    }
  });
  return outcomes;
}

// Best-effort: fetches live ESPN cover probability for every in-progress game in
// the week (not scoped to one user), so it can be applied across everyone on the
// leaderboard. Same fragile, may-be-empty data source as the My Picks cover% line.
async function fetchCoverProbsForWeek(week, liveScores){
  const coverMap = {};
  const liveGames = week.games.filter(g=> g.espnId && liveScores[g.espnId] && liveScores[g.espnId].state==="in");
  await Promise.all(liveGames.map(async g=>{
    try{ const cp = await fetchEspnCoverProb(g.sport||week.sport, g.espnId); if(cp) coverMap[g.espnId] = cp; }catch(e){}
  }));
  return coverMap;
}
function buildHypoOutcomesFromCoverProb(week, coverProbMap){
  const outcomes = {};
  week.games.forEach(g=>{
    if(g.result) return;
    const cp = g.espnId ? coverProbMap[g.espnId] : null;
    if(!cp) return;
    const favCoverPct = g.favorite==="home" ? cp.homeCoverPct : cp.awayCoverPct;
    if(favCoverPct>50) outcomes[g.id]="favorite";
    else if(favCoverPct<50) outcomes[g.id]="dog";
  });
  return outcomes;
}

// Scores one week for one user, optionally projecting in-progress games in the
// current live week — either by freezing the live score ('score') or by treating
// >50% ESPN cover probability as a win ('prob'). Otherwise identical to scoreWeek.
async function scoreWeekForLeaderboard(week, picks, adjustment, mode, cache){
  if(mode==="score" || mode==="prob"){
    const outcomes = mode==="score" ? buildHypoOutcomesFromLive(week, cache||{}) : buildHypoOutcomesFromCoverProb(week, cache||{});
    const s = scoreWeekHypothetical(week, picks, outcomes);
    s.total += adjustment;
    return s;
  }
  return scoreWeek(week, picks, adjustment);
}

async function renderLeaderboardPage(main){
  if(!LB_WEEK) LB_WEEK = STATE.currentWeek;
  const weekIds = STATE.weekOrder.filter(id=>STATE.weeks[id].finalized);
  const usernames = Object.keys(STATE.users);
  const currentWeekId = STATE.currentWeek;
  const currentWeekInScope = currentWeekId && (LB_MODE==="season" ? weekIds.includes(currentWeekId) : LB_WEEK===currentWeekId);
  main.innerHTML = `
    <div class="card">
      <h2 class="card-title">Leaderboard</h2>
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <div class="toggle-group" style="margin-bottom:0;">
          <button id="lb-week-btn" class="${LB_MODE==='week'?'active':''}">Weekly</button>
          <button id="lb-season-btn" class="${LB_MODE==='season'?'active':''}">Season</button>
        </div>
        <div style="display:flex;gap:6px;">
          <button id="lb-current-toggle" class="btn ${LB_PROJECTION==='score'?'gold':'ghost'} sm" ${currentWeekInScope?"":"disabled"} title="${currentWeekInScope?"":"No live week in view right now"}">${LB_PROJECTION==='score'?"✓ ":""}Current</button>
          <button id="lb-prob-toggle" class="btn ${LB_PROJECTION==='prob'?'gold':'ghost'} sm" ${currentWeekInScope?"":"disabled"} title="${currentWeekInScope?"":"No live week in view right now"}">${LB_PROJECTION==='prob'?"✓ ":""}Cover Odds</button>
        </div>
      </div>
      ${LB_MODE==='week'?`<div class="field" style="max-width:260px;margin-top:12px;"><label>Week</label>
        <select id="lb-week-select">${weekIds.map(id=>`<option value="${id}" ${id===LB_WEEK?"selected":""}>${esc(weekOptionLabel(id))}</option>`).join("")}</select></div>`:""}
      ${LB_PROJECTION==='score' && currentWeekInScope?`<div class="notice" style="margin-top:12px;">Treating ${esc(weekLabel(STATE.weeks[currentWeekId]))}'s in-progress games as if they ended right now. Nothing here is saved.</div>`:""}
      ${LB_PROJECTION==='prob' && currentWeekInScope?`<div class="notice" style="margin-top:12px;">Treating ${esc(weekLabel(STATE.weeks[currentWeekId]))}'s in-progress games as a win if ESPN currently gives that side better than 50% to cover. Best-effort — some games may lack this data and stay pending. Nothing here is saved.</div>`:""}
      <div id="lb-table" style="margin-top:14px;"></div>
    </div>`;
  document.getElementById("lb-week-btn").onclick=()=>{LB_MODE="week";renderLeaderboardPage(main);};
  document.getElementById("lb-season-btn").onclick=()=>{LB_MODE="season";renderLeaderboardPage(main);};
  const curBtn = document.getElementById("lb-current-toggle");
  if(curBtn && currentWeekInScope) curBtn.onclick=()=>{LB_PROJECTION = LB_PROJECTION==="score" ? "none" : "score"; renderLeaderboardPage(main);};
  const probBtn = document.getElementById("lb-prob-toggle");
  if(probBtn && currentWeekInScope) probBtn.onclick=()=>{LB_PROJECTION = LB_PROJECTION==="prob" ? "none" : "prob"; renderLeaderboardPage(main);};
  const sel=document.getElementById("lb-week-select"); if(sel) sel.onchange=(e)=>{LB_WEEK=e.target.value;renderLeaderboardPage(main);};
  const tableEl=document.getElementById("lb-table");
  if(weekIds.length===0){ tableEl.innerHTML=`<div class="empty">No finalized weeks yet.</div>`; return; }

  const rows=[]; const weeksToScore = LB_MODE==="week"?[LB_WEEK]:weekIds;
  await Promise.all(weeksToScore.filter(Boolean).map(wid=> syncWeekResults(STATE.weeks[wid]).catch(()=>{})));
  let projectionCache = null;
  if(LB_PROJECTION!=="none" && currentWeekInScope){
    const week = STATE.weeks[currentWeekId];
    try{
      if(LB_PROJECTION==="score"){
        projectionCache = await fetchLiveScoresForWeek(week);
      } else {
        const liveScores = await fetchLiveScoresForWeek(week);
        projectionCache = await fetchCoverProbsForWeek(week, liveScores);
      }
    }catch(e){ projectionCache = {}; }
  }
  const tasks = [];
  for(const uname of usernames){
    for(const wid of weeksToScore){
      if(!wid) continue;
      tasks.push((async ()=>{
        try{
          const week=STATE.weeks[wid];
          const [picks, adj] = await Promise.all([loadPicksFor(wid,uname), loadAdjustment(wid, uname)]);
          const mode = (LB_PROJECTION!=="none" && wid===currentWeekId) ? LB_PROJECTION : "none";
          const s = await scoreWeekForLeaderboard(week, picks, adj.amount, mode, mode!=="none"?projectionCache:null);
          return {uname, total:s.total, wins:s.wins, losses:s.losses, pushes:s.pushes};
        }catch(e){ console.error("Leaderboard scoring failed for", uname, wid, e); return null; }
      })());
    }
  }
  const results = (await Promise.all(tasks)).filter(Boolean);
  const byUser = {};
  for(const uname of usernames) byUser[uname] = {uname, total:0, wins:0, losses:0, pushes:0};
  for(const r of results){
    byUser[r.uname].total += r.total; byUser[r.uname].wins += r.wins;
    byUser[r.uname].losses += r.losses; byUser[r.uname].pushes += r.pushes;
  }
  rows.push(...Object.values(byUser));
  rows.sort((a,b)=>b.total-a.total);
  tableEl.innerHTML = `<table><thead><tr><th>#</th><th>Player</th><th>Record</th><th style="text-align:right;">Pts</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="${r.uname===ME?'me':''}"><td class="rank">${i+1}</td>
      <td>${esc(r.uname)}${(STATE.commissioners||[]).includes(r.uname)?' <span style="font-size:11px;color:var(--text-dim);">(commish)</span>':''}</td>
      <td style="color:var(--text-dim);">${r.wins}-${r.losses}${r.pushes?`-${r.pushes}`:""}</td>
      <td class="pts-cell ${r.total>0?'pos':r.total<0?'neg':''}" style="text-align:right;">${r.total>0?"+":""}${r.total}</td></tr>`).join("")}
    </tbody></table>`;
}

async function renderAllPicksBody(){
  const body = document.getElementById("allpicks-body");
  if(!body) return;
  if(!ALLPICKS_WEEK || !STATE.weeks[ALLPICKS_WEEK]){ body.innerHTML = `<div class="empty">No weeks yet.</div>`; return; }
  const week = STATE.weeks[ALLPICKS_WEEK];
  body.innerHTML = `<div class="card-sub">Loading…</div>`;
  try{ await syncWeekResults(week); }catch(e){}
  let allPicks;
  try{ allPicks = await loadAllPicksForWeek(ALLPICKS_WEEK); }catch(e){ body.innerHTML = `<div class="empty">Couldn't load picks — try again.</div>`; return; }
  const picksByUser = {}; allPicks.forEach(r=>picksByUser[r.username]=r.picks||{});
  // You first, then everyone else alphabetically.
  let usernames = Object.keys(STATE.users).sort((a,b)=>{
    if(a===ME) return -1;
    if(b===ME) return 1;
    return a.localeCompare(b);
  });
  const q = ALLPICKS_SEARCH.trim().toLowerCase();
  if(q) usernames = usernames.filter(u=>u.toLowerCase().includes(q));
  if(!usernames.length){ body.innerHTML = `<div class="empty">No members match "${esc(ALLPICKS_SEARCH)}".</div>`; return; }

  body.innerHTML = usernames.map(u=>{
    const picks = picksByUser[u] || {};
    const visibleGames = week.games.filter(g=>isGameLocked(g,week));
    const rows = visibleGames.map(g=>{
      const p = picks[g.id];
      if(!p || !p.side){
        return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;">
          <span style="color:var(--text-dim);">${esc(g.away)} @ ${esc(g.home)}</span><span style="color:var(--text-dim);">no pick</span>
        </div>`;
      }
      const sideTeam = p.side==="home"?g.home:g.away;
      const oppTeam = p.side==="home"?g.away:g.home;
      const spreadTxt = p.side===g.favorite ? `-${g.spread}` : `+${g.spread}`;
      const mods = [p.star?"★":"", p.parlay?"Parlay":"", p.teaser?"Teaser":""].filter(Boolean).join(" · ");
      const cover = g.result ? coverResult(g,p.side,false) : null;
      return `<div style="padding:6px 0;border-bottom:1px solid var(--line);">
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;">
          <span><strong>${esc(sideTeam)}</strong> <span style="color:var(--text-dim);">${spreadTxt} vs ${esc(oppTeam)}</span></span>
          ${cover?`<span class="result-tag ${cover}" style="font-size:10.5px;padding:1px 6px;">${cover}</span>`:`<span style="font-size:10.5px;color:var(--text-dim);">locked</span>`}
        </div>
        ${mods?`<div style="font-size:11px;color:var(--gold);">${mods}</div>`:""}
      </div>`;
    }).join("");
    const hiddenCount = week.games.length - visibleGames.length;
    return `<div class="card" style="margin-bottom:10px;">
      <h3 style="font-size:16px;margin:0 0 6px 0;">${esc(u)}${u===ME?" (you)":""}</h3>
      ${visibleGames.length===0?`<p class="card-sub" style="margin:0;">Nothing locked yet.</p>`:rows}
      ${hiddenCount>0?`<p class="card-sub" style="margin:8px 0 0 0;">${hiddenCount} game${hiddenCount===1?"":"s"} still open — hidden until locked.</p>`:""}
    </div>`;
  }).join("");
}

async function loadAllPicksAllWeeks(){
  const rows = await sb("/rest/v1/bb_picks?select=week_id,username,picks");
  (rows||[]).forEach(r=>{ r.picks = resolveStarConflict(r.picks||{}, r.week_id); });
  return rows || [];
}

function twoSlicePie(title, aLabel, aVal, aColor, bLabel, bVal, bColor){
  const total = aVal+bVal;
  if(total===0){
    return `<div style="text-align:center;padding:10px;"><h4 style="margin:0 0 6px 0;font-size:14px;">${esc(title)}</h4><p style="font-size:12px;color:var(--text-dim);margin:0;">No data yet</p></div>`;
  }
  const aPct = Math.round(aVal/total*100);
  const bPct = 100-aPct;
  return `
  <div style="text-align:center;">
    <h4 style="margin:0 0 10px 0;font-size:14px;">${esc(title)}</h4>
    <div style="width:110px;height:110px;border-radius:50%;margin:0 auto 10px auto;background:conic-gradient(${aColor} 0% ${aPct}%, ${bColor} ${aPct}% 100%);"></div>
    <div style="font-size:12px;line-height:1.7;">
      <div><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${aColor};margin-right:5px;"></span>${esc(aLabel)} ${aPct}% (${aVal})</div>
      <div><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${bColor};margin-right:5px;"></span>${esc(bLabel)} ${bPct}% (${bVal})</div>
    </div>
  </div>`;
}

async function renderStatsBody(){
  const body = document.getElementById("stats-body");
  if(!body) return;
  body.innerHTML = `<div class="empty">Crunching the season…</div>`;
  let rows;
  try{ rows = await loadAllPicksAllWeeks(); }catch(e){ body.innerHTML = `<div class="empty">Couldn't load stats — try again.</div>`; return; }
  const scoped = STATS_SCOPE==="pool" ? rows : rows.filter(r=>r.username===STATS_SCOPE);

  let favCount=0, dogCount=0, starWin=0, starLoss=0, parlayHit=0, parlayMiss=0, teaserHit=0, teaserMiss=0;
  let straightWins=0, straightLosses=0, pushCount=0, decidedCount=0;
  const weeklyTotals = [];
  const gameConsensus = {};
  const memberModifierROI = {};

  for(const row of scoped){
    const week = STATE.weeks[row.week_id];
    if(!week) continue;
    const picks = row.picks || {};
    let strippedTotal = 0;
    for(const [gid,p] of Object.entries(picks)){
      const g = week.games.find(x=>x.id===gid);
      if(!g || !p || !p.side) continue;
      if(p.side===g.favorite) favCount++; else dogCount++;
      const cover = g.result ? coverResult(g,p.side,false) : null;
      if(cover){
        decidedCount++;
        if(cover==="push") pushCount++;
        else if(cover==="win"){ straightWins++; strippedTotal += g.points; }
        else if(cover==="loss"){ straightLosses++; }
        if(p.star){ if(cover==="win") starWin++; else if(cover==="loss") starLoss++; }
      }
      if(STATS_SCOPE==="pool" && g.result){
        const key = row.week_id+":"+gid;
        if(!gameConsensus[key]){
          const favTeamName = g.favorite==="home" ? g.home : g.away;
          const dogTeamName = g.favorite==="home" ? g.away : g.home;
          gameConsensus[key] = {away:g.away, home:g.home, favTeamName, dogTeamName, wLabel:weekLabel(week), fav:0, dog:0};
        }
        if(p.side===g.favorite) gameConsensus[key].fav++; else gameConsensus[key].dog++;
      }
    }
    const s = scoreWeek(week, picks, 0);
    if(s.parlayStatus==="hit") parlayHit++; else if(s.parlayStatus==="miss") parlayMiss++;
    if(s.teaserStatus==="hit") teaserHit++; else if(s.teaserStatus==="miss") teaserMiss++;
    weeklyTotals.push({username:row.username, weekId:row.week_id, total:s.total});
    if(!memberModifierROI[row.username]) memberModifierROI[row.username] = {stripped:0, actual:0};
    memberModifierROI[row.username].stripped += strippedTotal;
    memberModifierROI[row.username].actual += s.total;
  }

  const straightPct = (straightWins+straightLosses)>0 ? Math.round(straightWins/(straightWins+straightLosses)*100) : null;

  let extraHtml = "";
  if(STATS_SCOPE==="pool"){
    const consensusArr = Object.values(gameConsensus).filter(g=>(g.fav+g.dog)>0);
    let mostChalk=null, mostSplit=null;
    consensusArr.forEach(g=>{
      const total=g.fav+g.dog; const favPct=g.fav/total;
      const lopsided = Math.max(favPct, 1-favPct);
      const splitness = Math.abs(favPct-0.5);
      const majorityTeam = g.fav>=g.dog ? g.favTeamName : g.dogTeamName;
      const majorityPct = Math.round(lopsided*100);
      if(!mostChalk || lopsided>mostChalk.lopsided) mostChalk = {...g, lopsided, majorityTeam, majorityPct};
      if(!mostSplit || splitness<mostSplit.splitness) mostSplit = {...g, splitness, favPct:Math.round(favPct*100)};
    });
    let highest=null, lowest=null;
    weeklyTotals.forEach(w=>{
      if(!highest || w.total>highest.total) highest=w;
      if(!lowest || w.total<lowest.total) lowest=w;
    });
    const roiRows = Object.entries(memberModifierROI).map(([u,v])=>({u, roi: v.actual-v.stripped})).sort((a,b)=>b.roi-a.roi);

    extraHtml = `
      <div class="yard-divider"></div>
      <h3 style="font-size:18px;margin:0 0 10px 0;">More stats</h3>
      <div style="font-size:14px;line-height:1.9;">
        Straight-pick win % (pool average): <strong>${straightPct!=null?straightPct+"%":"—"}</strong><br>
        Push rate: <strong>${decidedCount?Math.round(pushCount/decidedCount*100):0}%</strong> of decided picks (${pushCount} push${pushCount===1?"":"es"})<br>
        ${highest?`Highest single-week score: <strong>${esc(highest.username)}</strong>, ${esc(weekLabel(STATE.weeks[highest.weekId]))} — ${highest.total>0?"+":""}${highest.total} pts<br>`:""}
        ${lowest?`Lowest single-week score: <strong>${esc(lowest.username)}</strong>, ${esc(weekLabel(STATE.weeks[lowest.weekId]))} — ${lowest.total>0?"+":""}${lowest.total} pts<br>`:""}
      </div>
      ${mostChalk?`<div class="notice" style="margin-top:12px;">Most agreed-upon pick: <strong>${esc(mostChalk.wLabel)}</strong> — ${esc(mostChalk.away)} @ ${esc(mostChalk.home)}, ${mostChalk.majorityPct}% of the pool on ${esc(mostChalk.majorityTeam)}</div>`:""}

let WHATIF_MODE = "future";
let WHATIF_FUTURE_CHOICES = {}; // gameId -> 'favorite'|'dog'|'push'
let WHATIF_PAST_SCOPE = "all";

function scoreWeekHypothetical(week, picks, hypoOutcomes){
  let total=0, wins=0, losses=0, pushes=0, pending=0;
  const perGame={}; const parlayGameIds=[]; const teaserGameIds=[];
  for(const g of week.games){
    const p = picks[g.id]; if(!p || !p.side) continue;
    let base;
    if(g.result){ base = coverResult(g,p.side,false); }
    else if(hypoOutcomes[g.id]){
      const outcome = hypoOutcomes[g.id];
      if(outcome==="push") base="push";
      else{
        const winSide = outcome==="favorite" ? g.favorite : (g.favorite==="home"?"away":"home");
        base = p.side===winSide ? "win" : "loss";
      }
    } else base = null;
    let pts=0;
    if(base==="win"){ pts=p.star?g.points*2:g.points; wins++; }
    else if(base==="loss"){ pts=p.star?-g.points*2:0; losses++; }
    else if(base==="push"){ pts=0; pushes++; }
    else pending++;
    perGame[g.id] = {base, pts};
    total += pts;
    if(p.parlay) parlayGameIds.push(g.id);
    if(p.teaser) teaserGameIds.push(g.id);
  }
  let parlayBonus=0, parlayStatus=null;
  if(parlayGameIds.length===3){
    const results = parlayGameIds.map(id=>perGame[id].base);
    if(results.some(r=>r==="loss")){ parlayStatus="miss"; }
    else if(results.some(r=>r==null)){ parlayStatus="pending"; }
    else if(results.every(r=>r==="win")){ parlayBonus=3; parlayStatus="hit"; }
    else parlayStatus="miss";
  }
  let teaserBonus=0, teaserStatus=null;
  if(teaserGameIds.length>=1){
    // Use proper teaser-adjusted (±6) grading for already-decided legs, matching
    // real scoreWeek(). Hypothetical/undecided legs reuse their base outcome,
    // consistent with this tool's documented decisive-outcome assumption.
    const results = teaserGameIds.map(id=>{
      const g = week.games.find(x=>x.id===id);
      return g.result ? coverResult(g, picks[id].side, true) : perGame[id].base;
    });
    if(results.some(r=>r==="loss")){ teaserBonus=-2; teaserStatus="miss"; }
    else if(teaserGameIds.length===2 && results.every(r=>r==="win")){ teaserBonus=2; teaserStatus="hit"; }
    else if(results.some(r=>r==null)){ teaserStatus="pending"; }
    else { teaserStatus = teaserGameIds.length===2 ? "miss" : "pending"; }
  }
  total += parlayBonus + teaserBonus;
  return {total, wins, losses, pushes, pending};
}

  };

let WHATIF_REMOVE_STAR = true;
let WHATIF_REMOVE_TEASER = true;

// Recomputes a week's total for one member with star and/or teaser effects
// optionally neutralized. Parlay is always left as-is (not part of this tool).
function scoreWeekModified(week, picks, adjustment, removeStar, removeTeaser){
  let total = adjustment;
  const perGame = {};
  for(const g of week.games){
    const p = picks[g.id]; if(!p || !p.side || !g.result) continue;
    const base = coverResult(g, p.side, false);
    const useStar = p.star && !removeStar;
    let pts = 0;
    if(base==="win") pts = useStar ? g.points*2 : g.points;
    else if(base==="loss") pts = useStar ? -g.points*2 : 0;
    perGame[g.id] = {base, pts, teaser: !!p.teaser};
    total += pts;
  }
  const teaserIds = Object.keys(perGame).filter(id=>perGame[id].teaser);
  if(!removeTeaser && teaserIds.length===2){
    const results = teaserIds.map(id=>{
      const g = week.games.find(x=>x.id===id);
      return coverResult(g, picks[id].side, true);
    });
    if(results.every(r=>r==="win")) total += 2;
    else if(results.every(r=>r!=null)) total += -2;
  }
  return total;
}

          }).join("")}
        </tbody>
      </table>
      <p class="card-sub" style="margin-top:8px;">Rank Δ: ▲ means their real modifier use moved them up from where "${esc(label)}" would've had them; ▼ means it cost them position.</p>`;
  };
}

    const pickedCount = Object.values(picks).filter(p=>p && p.side).length;
    const lastSave = activity[0] ? activity[0].ts : null;
    return {uname, pickedCount, lastSave};
  }));
  body.innerHTML = rows.map(r=>{
    const done = r.pickedCount>0;
    const complete = r.pickedCount>=totalGames && totalGames>0;
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);">
      <div style="font-size:14px;">${esc(r.uname)}${r.lastSave?` <span style="color:var(--text-dim);font-size:12px;">· last saved ${fmtTs(new Date(r.lastSave).getTime())}</span>`:""}</div>
      <span class="result-tag ${complete?'win':done?'push':'loss'}">${complete?"ALL PICKED":done?`${r.pickedCount}/${totalGames}`:"NO PICKS"}</span>
    </div>`;
  }).join("");
}

async function loadEspnSlate(isRefresh){
  const listEl = document.getElementById("espn-list");
  if(!listEl) return;
  ESPN_LOADING = true; ESPN_ERR="";
  listEl.innerHTML = `<div class="card-sub">Fetching live ${SPORT_LABELS[ESPN_PULL_SPORT]} Week ${ESPN_PULL_WEEKNUM} games from ESPN…</div>`;
  try{
    ESPN_SLATE = await fetchEspnSlate(ESPN_PULL_SPORT, ESPN_PULL_WEEKNUM);
    const week = STATE.weeks[COMMISH_DRAFT_WEEK];
    if(isRefresh && week.locked) await addLog("Refreshed ESPN odds (post-lock)", `${SPORT_LABELS[ESPN_PULL_SPORT]} Week ${ESPN_PULL_WEEKNUM}`);
  }catch(err){
    ESPN_ERR = err.message || "Couldn't reach ESPN.";
    ESPN_SLATE = [];
  }
  ESPN_LOADING = false;
  renderEspnList();
}
function renderEspnList(){
  const listEl = document.getElementById("espn-list"); if(!listEl) return;
  if(ESPN_ERR){ listEl.innerHTML = `<div class="error">${esc(ESPN_ERR)} — GitHub Pages allows this fetch; if you're previewing outside the hosted site it may be blocked locally.</div>`; return; }
  if(ESPN_SLATE.length===0){ listEl.innerHTML = `<div class="card-sub">No games found for this week yet.</div>`; return; }
  listEl.innerHTML = ESPN_SLATE.map((g,i)=>`
    <div class="espn-row">
      <input type="checkbox" id="espn-chk-${i}">
      <div class="g-teams"><strong>${esc(g.away)}</strong> @ <strong>${esc(g.home)}</strong>
        <div class="g-spread">${g.favorite==='home'?esc(g.home):esc(g.away)} -${g.spread||0}${g.kickoff?" · "+new Date(g.kickoff).toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'}):""}</div>
      </div>
      <input class="g-pts" type="number" min="1" value="1" id="espn-pts-${i}">
    </div>`).join("");
  document.getElementById("espn-add-btn").onclick = async ()=>{
    let added=0;
    for(let i=0;i<ESPN_SLATE.length;i++){
      const chk=document.getElementById("espn-chk-"+i);
      if(chk && chk.checked){
        const g=ESPN_SLATE[i];
        const pts=Number(document.getElementById("espn-pts-"+i).value)||1;
        await addGameToWeek({ id:uid(), away:g.away, home:g.home, favorite:g.favorite, spread:g.spread, points:pts, kickoff:g.kickoff, dayLabel:g.dayLabel, espnId:g.espnId, sport:ESPN_PULL_SPORT, espnWeekNum:ESPN_PULL_WEEKNUM, result:null });
        added++;
      }
    }
    if(added){
      const week = STATE.weeks[COMMISH_DRAFT_WEEK];
      if(week.locked) await addLog("Added games from ESPN (post-lock)", `${added} game(s) added to ${weekLabel(week)}`);
      renderCommishWeekEditor(document.getElementById("main"));
    }
    else alert("Check at least one game first.");
  };
}

async function addGameToWeek(g){
  const week = STATE.weeks[COMMISH_DRAFT_WEEK];
  const sport = g.sport || week.sport;
  const espnWeekNum = g.espnWeekNum!=null ? g.espnWeekNum : week.week_num;
  await sb("/rest/v1/bb_games", {method:"POST", prefer:"return=minimal", body: JSON.stringify({
    id:g.id, week_id:COMMISH_DRAFT_WEEK, away:g.away, home:g.home, favorite:g.favorite, spread:g.spread, points:g.points,
    kickoff:g.kickoff, day_label:g.dayLabel, espn_id:g.espnId||null, sport, espn_week_num:espnWeekNum, has_result:false
  })});
  week.games.push({...g, sport, espnWeekNum});
}

async function renderTimeTravel(main){

  const picks = await loadPicksFor(COMMISH_TT_WEEK, COMMISH_TT_USER);
  const lockedGames = week.games.filter(g=>isGameLocked(g,week));
  const hiddenCount = week.games.length - lockedGames.length;
  const displayWeek = {...week, games: lockedGames};
  body.innerHTML = `<div class="notice">Editing picks for <strong>${esc(COMMISH_TT_USER)}</strong> — ${esc(weekLabel(week))}. Saving logs a retroactive-pick entry.${hiddenCount>0?` ${hiddenCount} game${hiddenCount===1?"":"s"} still open — hidden here until they lock, so their in-progress picks stay private.`:""}</div><div id="tt-games"></div>${lockedGames.length?`<button class="btn gold sm" id="tt-save-btn" style="margin-top:10px;">Save on their behalf</button>`:""}`;
  if(lockedGames.length===0){ document.getElementById("tt-games").innerHTML = `<div class="empty">No games have locked yet this week.</div>`; return; }
  renderPickGames(document.getElementById("tt-games"), displayWeek, COMMISH_TT_WEEK, picks, COMMISH_TT_USER, true, false);
  const innerSave=document.getElementById("save-picks-btn"); if(innerSave) innerSave.style.display="none";
  document.getElementById("tt-save-btn").onclick = async ()=>{
    const validIds = new Set(week.games.map(g=>g.id));
    const clean={}; for(const [gid,p] of Object.entries(picks)){ if(p && p.side && validIds.has(gid)) clean[gid]=p; }
    let starSeen = false;
    for(const g of week.games){
      const p = clean[g.id];
      if(p && p.star){
        if(starSeen) p.star = false; else starSeen = true;
      }
    }
    await savePicksFor(COMMISH_TT_WEEK, COMMISH_TT_USER, clean);
    await logPickActivity(COMMISH_TT_WEEK, COMMISH_TT_USER, Object.keys(clean).length, ME);
    await addLog("Set picks on behalf of member", `${COMMISH_TT_USER} — ${weekLabel(week)} (entered by commissioner)`);
    alert("Saved picks for "+COMMISH_TT_USER);
  };
}
