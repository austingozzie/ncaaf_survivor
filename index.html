    return `<tr>
      <td>${esc(g.away)} @ ${esc(g.home)}</td>
      <td>${esc(sideTeam)}</td>
      <td>${cover||"pending"} <span style="color:var(--text-dim);font-size:12px;">${mods}</span></td>
      <td style="text-align:right;" class="${displayPts>0?'pts-cell pos':displayPts<0?'pts-cell neg':''}">${displayPts!=null?(displayPts>0?"+":"")+displayPts:"—"}</td>
    </tr>`;
  }).join("");

  const starPicks = Object.values(s.perGame).filter(pg=>pg.star);
  const plainWinTotal = Object.values(s.perGame).filter(pg=>pg.base==="win").reduce((sum,pg)=> sum + (pg.star ? pg.pts/2 : pg.pts), 0);
  const straightSubtotal = s.total - s.parlayBonus - s.teaserBonus - s.adjustment;
  const starDelta = straightSubtotal - plainWinTotal;

  body.innerHTML = `
    <table>
      <thead><tr><th>Game</th><th>Picked</th><th>Result</th><th style="text-align:right;">Pts</th></tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table>
    <p class="card-sub" style="margin-top:8px;">"Pts" is this game's own result, plus its share of any parlay/teaser bundle. A teaser's −2 lands on whichever leg loses first; its +2 lands on the second leg once both have won. A parlay's +3 lands on whichever leg resolves last. Each bundle's total is only counted once — also summarized below.</p>
    <div class="yard-divider"></div>
    <div style="font-size:14px;line-height:1.9;">
      Base picks: ${s.wins}-${s.losses}${s.pushes?`-${s.pushes}`:""} → base ${plainWinTotal>0?"+":""}${plainWinTotal}<br>
      ${starPicks.length?`Star swing (${starPicks.length} game${starPicks.length===1?"":"s"}, 2× either way): ${starDelta>=0?"+":""}${starDelta}<br>`:""}
      Parlay bundle (3 legs): ${s.parlayStatus?`${s.parlayStatus} → ${s.parlayBonus>0?"+":""}${s.parlayBonus}`:"not attempted"}<br>
      Teaser bundle (2 legs, ±6): ${s.teaserStatus?`${s.teaserStatus} → ${s.teaserBonus>0?"+":""}${s.teaserBonus}`:"not attempted"}<br>
      Commissioner adjustment: ${s.adjustment>0?"+":""}${s.adjustment}${adj.note?` — "${esc(adj.note)}"`:""}<br>
      <strong style="font-size:18px;">Total: ${s.total>0?"+":""}${s.total}</strong>
    </div>
    <div class="yard-divider"></div>
    <h4 style="margin:0 0 8px 0;">Manual adjustment</h4>
    <p class="card-sub" style="margin-top:0;">Adds or subtracts points directly, on top of everything above. Applies to the leaderboard and history everywhere.</p>
    <div class="row">
      <div class="field"><label>Adjustment (+/-)</label><input type="number" id="audit-adj-amount" value="${adj.amount}"></div>
      <div class="field"><label>Reason (optional)</label><input type="text" id="audit-adj-note" value="${esc(adj.note)}" placeholder="e.g. scoring error on game 3"></div>
    </div>
    <button class="btn gold sm" id="audit-adj-save" style="margin-top:8px;">Save adjustment</button>
    <div id="audit-adj-msg" style="font-size:13px;margin-top:8px;"></div>
    <div class="yard-divider"></div>
    <h4 style="margin:0 0 8px 0;">Pick activity</h4>
    <p class="card-sub" style="margin-top:0;">Every time picks were saved for this member this week.</p>
    ${activity.length===0?`<div class="card-sub">No saves recorded yet.</div>`:
      activity.map(a=>`<div class="log-entry"><div class="log-ts">${fmtTs(new Date(a.ts).getTime())}</div>
        <div class="log-desc">${a.pick_count} game${a.pick_count===1?"":"s"} picked${a.made_by && a.made_by!==AUDIT_USER?` — entered by ${esc(a.made_by)}`:""}</div></div>`).join("")}
  `;
  document.getElementById("audit-adj-save").onclick = async ()=>{
    const amount = Number(document.getElementById("audit-adj-amount").value)||0;
    const note = document.getElementById("audit-adj-note").value.trim();
    await saveAdjustment(AUDIT_WEEK, AUDIT_USER, amount, note);
    await addLog("Manual score adjustment", `${AUDIT_USER} — ${weekLabel(week)} — ${amount>0?"+":""}${amount}${note?` (${note})`:""}`);
    document.getElementById("audit-adj-msg").textContent = "Saved.";
    document.getElementById("audit-adj-msg").style.color = "var(--field)";
  };
}

// ---------- Account ----------
function renderAccountPage(main){
  main.innerHTML = `
    <div class="card">
      <button class="link-btn" id="account-back-btn">← Back</button>
      <h2 class="card-title" style="margin-top:10px;">Account</h2>
      <p class="card-sub">Signed in as <strong>${esc(ME)}</strong></p>
      <div class="yard-divider"></div>
      <h4 style="margin:0 0 8px 0;">Change password</h4>
      <div class="field"><label>Current password</label><input type="password" id="pw-current" autocomplete="off"></div>
      <div class="field"><label>New password</label><input type="password" id="pw-new" autocomplete="off" minlength="4"></div>
      <div class="field"><label>Confirm new password</label><input type="password" id="pw-confirm" autocomplete="off" minlength="4"></div>
      <button class="btn gold sm" id="pw-save-btn" style="margin-top:10px;">Update password</button>
      <div id="pw-msg" style="font-size:13px;margin-top:8px;"></div>
      <div class="yard-divider"></div>
      <button class="btn danger sm" id="logout-btn">Log out</button>
    </div>`;
  document.getElementById("account-back-btn").onclick = ()=>{ ROUTE="picks"; renderApp(); };
  document.getElementById("logout-btn").onclick = ()=>{
    if(confirm("Log out of Bool Bloods?")){ ME=null; localDel("boolbloodsUser"); render(); }
  };
  document.getElementById("pw-save-btn").onclick = async ()=>{
    const msg = document.getElementById("pw-msg");
    const current = document.getElementById("pw-current").value;
    const next = document.getElementById("pw-new").value;
    const confirmVal = document.getElementById("pw-confirm").value;
    msg.style.color = "var(--red)";
    if(!current || !next || !confirmVal){ msg.textContent = "Fill out every field."; return; }
    if(next.length < 4){ msg.textContent = "New password needs to be at least 4 characters."; return; }
    if(next !== confirmVal){ msg.textContent = "New passwords don't match."; return; }
    const currentHash = await sha256(current);
    if(currentHash !== STATE.users[ME].passHash){ msg.textContent = "Current password is wrong."; return; }
    const newHash = await sha256(next);
    try{
      await sb("/rest/v1/bb_users?username=eq."+encodeURIComponent(ME), {method:"PATCH", prefer:"return=minimal", body: JSON.stringify({pass_hash:newHash})});
      STATE.users[ME].passHash = newHash;
      msg.style.color = "var(--field)";
      msg.textContent = "Password updated.";
      document.getElementById("pw-current").value = "";
      document.getElementById("pw-new").value = "";
      document.getElementById("pw-confirm").value = "";
    }catch(e){
      msg.textContent = "Couldn't reach the database — try again.";
    }
  };
}

// ---------- Owner ----------
function renderOwnerPage(main){
  const usernames=Object.keys(STATE.users);
  main.innerHTML = `
    <div class="card">
      <h2 class="card-title">League Setup</h2>
      <p class="card-sub">Owner controls — appoint who runs the weekly slate. Check as many as you want.</p>
      <label>Commissioners</label>
      <div id="commish-checks">
        ${usernames.map(u=>`
          <label style="display:flex;align-items:center;gap:8px;padding:7px 0;font-size:14px;font-weight:400;color:var(--text);margin:0;">
            <input type="checkbox" style="width:auto;" data-commish-check value="${esc(u)}" ${STATE.commissioners.includes(u)?"checked":""}>
            ${esc(u)}
          </label>`).join("")}
      </div>
      <button class="btn sm" id="set-commish-btn" style="margin-top:10px;">Save commissioners</button>
      <div class="yard-divider"></div>
      <h4 style="margin:0 0 8px 0;">Members (${usernames.length})</h4>
      ${usernames.map(u=>`<div style="padding:6px 0;font-size:14px;">${esc(u)} <span style="color:var(--text-dim);font-size:12px;">${u===STATE.owner?"· owner":""}${STATE.commissioners.includes(u)?" · commissioner":""}</span></div>`).join("")}
      <div class="yard-divider"></div>
      <h4 style="margin:0 0 8px 0;">Reset a member's password</h4>
      <p class="card-sub" style="margin-top:0;">For when someone forgets their password — sets it directly rather than them having to create a new account.</p>
      <div class="row">
        <div class="field"><label>Member</label><select id="reset-pw-user">${usernames.map(u=>`<option value="${u}">${esc(u)}</option>`).join("")}</select></div>
        <div class="field"><label>New password</label><input type="password" id="reset-pw-value" minlength="4"></div>
      </div>
      <button class="btn danger sm" id="reset-pw-btn" style="margin-top:10px;">Reset password</button>
      <div id="reset-pw-msg" style="font-size:13px;margin-top:8px;"></div>
    </div>`;
  document.getElementById("set-commish-btn").onclick = async ()=>{
    const checked = Array.from(document.querySelectorAll("[data-commish-check]:checked")).map(el=>el.value);
    const before = STATE.commissioners;
    await patchLeague({commissioners: checked});
    STATE.commissioners = checked;
    const added = checked.filter(u=>!before.includes(u));
    const removed = before.filter(u=>!checked.includes(u));
    let detail = [];
    if(added.length) detail.push(`added ${added.join(", ")}`);
    if(removed.length) detail.push(`removed ${removed.join(", ")}`);
    await addLog("Commissioners updated", detail.length? detail.join(" · ") : "No change.");
    renderOwnerPage(main);
  };
  document.getElementById("reset-pw-btn").onclick = async ()=>{
    const msg = document.getElementById("reset-pw-msg");
    const target = document.getElementById("reset-pw-user").value;
    const newPw = document.getElementById("reset-pw-value").value;
    msg.style.color = "var(--red)";
    if(!newPw || newPw.length<4){ msg.textContent = "Password needs to be at least 4 characters."; return; }
    if(!confirm(`Reset ${target}'s password? They'll need the new password to log in.`)) return;
    try{
      const newHash = await sha256(newPw);
      await sb("/rest/v1/bb_users?username=eq."+encodeURIComponent(target), {method:"PATCH", prefer:"return=minimal", body: JSON.stringify({pass_hash:newHash})});
      STATE.users[target].passHash = newHash;
      await addLog("Password reset by owner", `${target}'s password was reset.`);
      msg.style.color = "var(--field)";
      msg.textContent = `Done — tell ${target} their new password.`;
      document.getElementById("reset-pw-value").value = "";
    }catch(e){ msg.textContent = "Couldn't reach the database — try again."; }
  };
}

// ---------- boot ----------
async function boot(){
  try{
    await ensureLeagueRow();
    await loadAll();
  }catch(err){
    LOADING=false;
    app.innerHTML = `<div class="login-wrap"><div class="card login-card"><h2 class="card-title">Can't reach the database</h2><p class="card-sub">${esc(err.message||String(err))}</p><p style="font-size:13px;color:var(--text-dim);">Make sure the setup SQL has been run in Supabase and this page is served over https (GitHub Pages, not opened as a local file).</p></div></div>`;
    return;
  }
  const saved = localGet("boolbloodsUser");
  if(saved && STATE.users[saved]) ME = saved;
  LOADING = false;
  render();
}
boot();

})();
</script>
</body>
</html>
